name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # The load-bearing pin: corridor-contracts' on-chain verifier (vendored
  # ultrahonk-rust-verifier core) targets Barretenberg 0.87.0 / UltraKeccakFlavor,
  # which pairs with Noir 1.0.0-beta.9. A mismatch is NOT caught by length
  # checks -- it silently fails at transcript/pairing (see corridor-contracts
  # HANDOFF.md §5 #12). Keep these two in lockstep with the verifier.
  NOIR_VERSION: "1.0.0-beta.9"
  BB_VERSION: "0.87.0"

jobs:
  circuit:
    name: check + fmt + test + execute
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corridor_eligibility
    steps:
      - uses: actions/checkout@v4
      - name: Install Noir ${{ env.NOIR_VERSION }}
        run: |
          curl -L https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
          "$HOME/.nargo/bin/noirup" --version "$NOIR_VERSION"
      - run: nargo fmt --check
      - run: nargo check
      - run: nargo test
      - name: Witness-solve the committed fixture
        run: nargo execute
      - name: Gate count
        run: nargo info

  prove:
    name: bb prove + verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corridor_eligibility
    steps:
      - uses: actions/checkout@v4
      - name: Install Noir + Barretenberg
        run: |
          curl -L https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
          "$HOME/.nargo/bin/noirup" --version "$NOIR_VERSION"
          curl -L https://raw.githubusercontent.com/AztecProtocol/aztec-packages/refs/heads/next/barretenberg/bbup/install | bash
          echo "$HOME/.bb" >> "$GITHUB_PATH"
          "$HOME/.bb/bbup" -v "$BB_VERSION" --no-modify-path
      - run: nargo execute
      - name: Prove and verify (UltraHonk)
        # Version-matched nargo/bb (0.87.0 pairs with 1.0.0-beta.9), so this is
        # a hard gate, not a smoke test: any prove/verify failure must turn the
        # build red. bb 0.87.0 shells out to `jq` for ACIR JSON parsing
        # (preinstalled on ubuntu-latest).
        run: |
          bb write_vk --scheme ultra_honk --oracle_hash keccak --bytecode_path ./target/corridor_eligibility.json --output_path ./target --output_format bytes_and_fields
          bb prove    --scheme ultra_honk --oracle_hash keccak --bytecode_path ./target/corridor_eligibility.json --witness_path ./target/corridor_eligibility.gz --output_path ./target --output_format bytes_and_fields
          bb verify   --scheme ultra_honk --oracle_hash keccak --vk_path ./target/vk --proof_path ./target/proof --public_inputs_path ./target/public_inputs
          echo "proof verified"
